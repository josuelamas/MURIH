<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MURH Hipódromo · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep:#14366B;
    --blue-main:#215AB3;
    --blue-soft:#4D7BC2;
    --blue-lightest:#C8D6EC;
    --cream:#F4F7FB;
    --ink:#14366B;
    --grey:#95A5BC;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--blue-main);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.10) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(20,54,107,0.35) 0%, transparent 50%),
      radial-gradient(circle at 80% 15%, rgba(77,123,194,0.22) 0%, transparent 40%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(0px);
    opacity:0.9;
  }
  .blob1{
    width:420px;height:380px;
    background:var(--blue-deep);
    top:-140px;left:-140px;
    border-radius:58% 42% 63% 37% / 41% 55% 45% 59%;
  }
  .blob2{
    width:300px;height:260px;
    background:rgba(255,255,255,0.08);
    bottom:-90px;right:-60px;
    border-radius:63% 37% 41% 59% / 55% 45% 59% 41%;
  }
  .card{
    position:relative;
    z-index:2;
    width:min(420px, 90vw);
    background:var(--cream);
    border-radius:38px 44px 40px 46px / 46px 40px 44px 38px;
    padding:44px 40px 38px;
    box-shadow:0 30px 60px -20px rgba(10,20,50,0.55);
  }
  .logo-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:6px;
  }
  .logo-badge{
    width:78px;height:78px;
    background:var(--blue-main);
    border-radius:44% 56% 52% 48% / 50% 46% 54% 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:inset 0 -6px 12px rgba(0,0,0,0.15), 0 10px 20px -8px rgba(33,90,179,0.6);
  }
  .logo-badge .murh-mark{width:44px;height:44px;display:block;}
  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:28px;
    text-align:center;
    color:var(--blue-deep);
    margin:14px 0 2px;
    letter-spacing:-0.3px;
  }
  .sub{
    text-align:center;
    color:var(--grey);
    font-size:13.5px;
    font-weight:600;
    margin:0 0 28px;
    text-transform:uppercase;
    letter-spacing:1.2px;
  }
  label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--blue-deep);
    margin:0 0 6px 4px;
    text-transform:uppercase;
    letter-spacing:0.6px;
  }
  .field{margin-bottom:16px;}
  select, input{
    width:100%;
    padding:13px 16px;
    border-radius:16px;
    border:2px solid var(--blue-lightest);
    background:var(--white);
    font-family:'Manrope',sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  select:focus, input:focus{
    border-color:var(--blue-main);
    box-shadow:0 0 0 4px rgba(33,90,179,0.15);
  }
  button{
    width:100%;
    margin-top:8px;
    padding:14px 16px;
    border:none;
    border-radius:18px;
    background:var(--blue-deep);
    color:var(--white);
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    letter-spacing:0.3px;
    transition:transform .12s ease, background .15s ease;
  }
  button:hover{background:var(--blue-main); transform:translateY(-1px);}
  button:active{transform:translateY(0);}
  .error{
    color:var(--blue-deep);
    font-size:13px;
    font-weight:700;
    text-align:center;
    margin-top:14px;
    min-height:16px;
  }
  .foot{
    text-align:center;
    margin-top:22px;
    font-size:11.5px;
    color:rgba(20,54,107,0.45);
    font-weight:600;
  }

  .card.wide{width:min(560px, 92vw);}
  #modulos{display:none;}
  .welcome{text-align:center;color:var(--blue-deep);font-weight:700;font-size:15px;margin:0 0 18px;}
  .mods{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mod{display:block;text-decoration:none;background:var(--white);border:2px solid var(--blue-lightest);border-radius:20px;padding:16px 14px;color:var(--blue-deep);font-weight:800;font-family:'Baloo 2',sans-serif;font-size:16px;transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease;}
  .mod small{display:block;font-family:'Manrope',sans-serif;font-weight:600;font-size:12px;color:var(--grey);margin-top:2px;}
  a.mod:hover{border-color:var(--blue-main);transform:translateY(-2px);box-shadow:0 10px 20px -10px rgba(33,90,179,.5);}
  .mod.off{opacity:.55;cursor:default;background:transparent;border-style:dashed;}
  .mod .tag{float:right;font-family:'Manrope',sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--blue-main);background:var(--blue-lightest);border-radius:10px;padding:2px 8px;}
  .logout{background:transparent;color:var(--blue-main);border:2px solid var(--blue-lightest);margin-top:18px;}
  .logout:hover{background:var(--blue-lightest);}
  @media(max-width:480px){.mods{grid-template-columns:1fr;}}
</style>
</head>
<body>

  <div class="blob blob2"></div>

    </div>
    <h1>MURH Hipódromo</h1>
    <p class="sub">Panel interno · Acceso</p>

    <div id="loginView"><form id="loginForm">
      <div class="field">
        <label for="user">Usuario</label>
        <select id="user" required>
          <option value="" disabled selected>Selecciona tu usuario</option>
          <option value="marco">Marco</option>
          <option value="martin">Martín</option>
        </select>
      </div>
      <div class="field">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit">Entrar al panel</button>
      <div class="error" id="err"></div>
    </form></div>
    <div id="modulos">
      <p class="welcome" id="welcome"></p>
      <div class="mods" id="modsGrid"></div>
      <button type="button" class="logout" id="logout">Cerrar sesión</button>
    </div>
    <p class="foot">MURH Hipódromo © 2026 — uso interno</p>
  </div>

<script>
  const CREDS = {
    marco:  "Murh_Marco26",
    martin: "Murh_Martin26"
  };

  // ============================================================
  // MÓDULOS — para agregar uno nuevo: sube su .html a GitHub y
  // agrega una línea aquí. url:null = "Próximamente".
  // ============================================================
  const MODULOS = [
    { nombre:'Inversión',            desc:'Capital y recuperación', url:'inversion.html' },
    { nombre:'Ventas',               desc:'POS, IVA y rentabilidad', url:'ventas.html' },
    { nombre:'Ventas Uber Eats',     desc:'Uber vs. precios cafetería', url:'ventas-ubereats.html' },
    { nombre:'Gastos operativos',    desc:'Compras, insumos y nómina', url:'gastos-operativos.html' },
    { nombre:'Estado de resultados', desc:'Utilidad del periodo',    url:'estado-resultados.html' }
  ];

  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('err');
  const card = document.querySelector('.card');

  function mostrarModulos(name){
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('modulos').style.display = 'block';
    card.classList.add('wide');
    document.querySelector('.sub').textContent = 'Selecciona un módulo';
    document.getElementById('welcome').textContent = 'Hola, ' + name;
    const grid = document.getElementById('modsGrid');
    grid.innerHTML = '';
    MODULOS.forEach(m => {
      const el = document.createElement(m.url ? 'a' : 'div');
      el.className = 'mod' + (m.url ? '' : ' off');
      if(m.url) el.href = m.url + '?user=' + encodeURIComponent(name);
      el.innerHTML = (m.url ? '' : '<span class="tag">Próx.</span>') + m.nombre + '<small>' + m.desc + '</small>';
      grid.appendChild(el);
    });
  }

  function mostrarLogin(){
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('modulos').style.display = 'none';
    card.classList.remove('wide');
    document.querySelector('.sub').textContent = 'Panel interno · Acceso';
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;
    if(CREDS[user] && CREDS[user] === pass){
      const displayName = user === 'marco' ? 'Marco' : 'Martín';
      try{ sessionStorage.setItem('murh_user', displayName); }catch(_){}
      mostrarModulos(displayName);
    } else {
      errEl.textContent = 'Usuario o contraseña incorrectos.';
    }
  });

  document.getElementById('logout').addEventListener('click', function(){
    try{ sessionStorage.removeItem('murh_user'); }catch(_){}
    document.getElementById('pass').value = '';
    mostrarLogin();
  });

  // Si ya inició sesión en esta pestaña (o viene de un módulo), muestra el menú directo
  try{
    if(location.search.includes('salir')) sessionStorage.removeItem('murh_user');
    const u = sessionStorage.getItem('murh_user');
    if(u) mostrarModulos(u);
  }catch(_){}
</script>
</body>
</html>
